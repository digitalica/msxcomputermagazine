# Runs behind Traefik, which handles TLS and the www -> apex redirect.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so they keep the https host Traefik serves.
    absolute_redirect off;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Old WordPress URLs (map in redirects.conf, generated by
    # scripts/migrate/redirects.mjs). Runs before any location.
    if ($old_url_redirect) {
        return 301 $old_url_redirect;
    }

    location = / {
        # /?s=<term> (search), /?page_id=<id>, /?feed=rss2
        if ($arg_s) {
            return 301 /search/?q=$arg_s;
        }
        if ($old_page_id_redirect) {
            return 301 $old_page_id_redirect;
        }
        if ($arg_feed) {
            return 301 /feed.xml;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-sitemap) { return 410; }

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Archive files, from the base image (docker/files.Dockerfile).
    # CORS lets WebMSX (webmsx.org) and preview deployments load them.
    location ~ ^/(archief/(bladen|lb|disks|diskzips)|mcm_dzi|wp-content/uploads)/ {
        root /srv/files;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=604800";
    }

    # Separate static sites from the old server.
    location ~ ^/(mccm|mccw)/ {
        root /srv/files;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}
