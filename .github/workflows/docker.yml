name: Build and push Docker image

on:
  # Run by hand after pushing a new files image.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "docker-compose.yml"
      - "scripts/**"
      - "files/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The archive files are in the base image, not needed here.
          sparse-checkout: |
            /*
            !/files/
          sparse-checkout-cone-mode: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/digitalica/msxcomputermagazine:latest
